<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="transparent" />
    <title>AI Desktop Pet</title>
    <script type="module" src="/main.js" defer></script>
  </head>

  <body>
    <main class="pet-stage" aria-live="polite">
      <div class="speech-bubble" id="speech-bubble" role="status">
        <span id="speech-text">こんにちは！</span>
      </div>

      <button
        class="pet pet--idle"
        id="pet"
        type="button"
        aria-label="Mochi。クリックで会話、ドラッグで移動"
      >
        <span class="pet__shadow" aria-hidden="true"></span>
        <span class="pet__sprite-frame" aria-hidden="true">
          <img class="pet__sprite" id="pet-sprite" alt="" draggable="false" />
        </span>
        <span class="pet__sleep-effect" aria-hidden="true">Zzz</span>
      </button>

      <div class="pet-menu pet-menu--hidden" id="pet-menu" role="menu">
        <button class="pet-menu__item" id="quit-pet" type="button" role="menuitem">
          終了
        </button>
      </div>
    </main>
  </body>
</html>
